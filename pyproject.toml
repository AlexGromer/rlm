[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm"
version = "0.1.0"
description = "Recursive Language Models — a model-agnostic reference implementation (arXiv:2512.24601)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlexGromer" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
rlm = "rlm.cli:main"

[tool.setuptools.packages.find]
include = ["rlm*"]

[tool.setuptools.package-data]
rlm = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
